<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="turretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="canonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal Tactical Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Radar Grid Circles -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>

  <!-- Turret Base Mount -->
  <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Dual Laser Barrels (Pointing Top-Right) -->
  <rect x="30" y="10" width="4" height="18" rx="1.5" fill="url(#canonGrad)" transform="rotate(30 32 32)"/>
  <rect x="36" y="10" width="4" height="18" rx="1.5" fill="url(#canonGrad)" transform="rotate(30 32 32)"/>

  <!-- Turret Rotating Core Dome -->
  <circle cx="32" cy="32" r="9" fill="url(#turretGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="4" fill="#38bdf8"/>

  <!-- Targeting Reticle Glow -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="48" cy="18" r="2.5" fill="#ef4444"/>
</svg>
